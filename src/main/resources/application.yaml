spring:
  application:
    name: consultant
  data:
    redis:
      host: 192.168.150.101
      port: 6379

  datasource:
    url: jdbc:mysql://localhost:3306/volunteer?useSSL=false&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  configuration:
    map-underscore-to-camel-case: true
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QW_API_KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QW_API_KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QW_API_KEY}
      model-name: qwen3.7-text-embedding
      log-requests: true
      log-responses: true
      max-segments-per-batch: 10
  community:
    redis:
      host: 192.168.150.101
      port: 6379

logging:
  level:
    dev.langchain4j: debug